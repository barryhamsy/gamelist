<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barry Game Store Collection</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --background-color: #f5f7fa;
      --card-bg: #ffffff;
      --text-color: #333;
      --text-light: #7f8c8d;
      --denuvo-color: #e74c3c;
      --badge-new: #27ae60;
    }

    body {
      background: var(--background-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: var(--text-color);
      padding: 20px;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    h1 {
      color: var(--primary-color);
      font-size: 2.5rem;
      margin-bottom: 8px;
    }

    .subtitle {
      color: var(--text-light);
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 25px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .game-card:hover {
      transform: translateY(-8px);
      box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    .game-image {
      width: 100%;
      height: 200px;
      object-fit: cover;
      display: block;
    }

    .game-info {
      padding: 18px;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .game-title {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-new {
      background: var(--badge-new);
      color: #fff;
      font-size: 0.7rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 12px;
      text-transform: uppercase;
    }

    .game-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .game-id, .denuvo-tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #fff;
      display: inline-block;
    }

    .game-id { background: var(--secondary-color); }
    .denuvo-tag { background: var(--denuvo-color); }

    .game-meta {
      font-size: 0.9rem;
      color: var(--text-light);
      line-height: 1.4;
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-light);
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Barry's Game Store Collection</h1>
    <p class="subtitle">Explore our curated selection of games</p>
  </header>

  <main>
    <div class="games-container" id="gamesContainer">
      <div class="loading">Loading games...</div>
    </div>
  </main>

  <footer>
    <p>© 2025 Barry's Games Store. All rights reserved.</p>
  </footer>

  <script>
    let allGames = [];

    document.addEventListener('DOMContentLoaded', () => {
      loadGames();
    });

    function loadGames() {
      fetch('branches_cache.json')
        .then(r => r.json())
        .then(games => {
          allGames = games;
          displayGames(games);
        })
        .catch(err => {
          console.error("Error loading:", err);
          document.getElementById("gamesContainer").innerHTML =
            "<p style='color:red;text-align:center;'>Failed to load games.</p>";
        });
    }

    function displayGames(games) {
      const container = document.getElementById("gamesContainer");
      container.innerHTML = "";

      games.forEach(game => {
        const appId = game.st_file.split('.')[0];
        const dateAdded = new Date(game.added_on).toLocaleDateString();

        const denuvoTag = game.requires_membership
          ? `<span class="denuvo-tag">DENUVO</span>` : "";

        const newBadge = game.new
          ? `<span class="badge-new">NEW</span>` : "";

        const descriptors = game.content_descriptors && game.content_descriptors.length
          ? game.content_descriptors.join(", ")
          : "None";

        const card = document.createElement("div");
        card.className = "game-card";
        card.innerHTML = `
          <img src="${appId}.jpg" alt="${game.name}" class="game-image" onerror="this.src='placeholder.jpg'">
          <div class="game-info">
            <div class="game-title">
              ${game.name} ${newBadge}
            </div>
            <div class="game-tags">
              <span class="game-id">AppID: ${appId}</span>
              ${denuvoTag}
            </div>
            <div class="game-meta">
              <strong>Added on:</strong> ${dateAdded}<br>
              <strong>Size:</strong> ${game.size_gb || 'Unknown'}<br>
              <strong>Downloads:</strong> ${game.downloads}<br>
              <strong>Genre:</strong> ${game.primary_genre}<br>
              <strong>Descriptors:</strong> ${descriptors}<br>
              <strong>Online Supported:</strong> ${game.online_supported}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }
  </script>
</body>
</html>
