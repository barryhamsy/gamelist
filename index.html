<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barry Game Store Collection</title>
  <style>
    :root {
      --primary-color: #2c3e50;
      --secondary-color: #3498db;
      --background-color: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #333;
      --text-light: #7f8c8d;
      --denuvo-color: #e74c3c;
    }

    body {
      background-color: var(--background-color);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      padding: 20px;
      color: var(--text-color);
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    h1 {
      font-size: 2.5rem;
      color: var(--primary-color);
    }

    .subtitle {
      color: var(--text-light);
    }

    .games-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .game-card {
      background: var(--card-bg);
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .game-card:hover {
      transform: translateY(-10px) scale(1.03);
      box-shadow: 0 12px 30px rgba(0,0,0,0.2);
    }

    .game-media {
      width: 100%;
      height: 200px;
      overflow: hidden;
      position: relative;
    }

    .game-media img, .game-media iframe {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border: none;
      display: block;
      transition: opacity 0.4s ease;
    }

    .game-media iframe {
      display: none;
    }

    .game-card:hover .game-media img {
      display: none;
    }

    .game-card:hover .game-media iframe {
      display: block;
    }

    .game-info {
      padding: 15px;
    }

    .game-title {
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 10px;
      color: var(--primary-color);
    }

    .game-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .game-id, .denuvo-tag {
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #fff;
    }

    .game-id {
      background: var(--secondary-color);
    }

    .denuvo-tag {
      background: var(--denuvo-color);
    }

    footer {
      margin-top: 40px;
      text-align: center;
      color: var(--text-light);
    }
  </style>
</head>
<body>
  <header>
    <h1>Barry's Game Store Collection</h1>
    <p class="subtitle">Hover over a card to preview the Steam page</p>
  </header>

  <main>
    <div class="games-container" id="gamesContainer">
      <!-- Cards will be injected dynamically -->
    </div>
  </main>

  <footer>
    <p>© 2025 Barry's Games Store. All rights reserved.</p>
  </footer>

  <script>
    // Example data, replace with your branches_cache.json
    const allGames = [
      { st_file: "1091500.st", name: "Cyberpunk 2077", requires_membership: true },
      { st_file: "1245620.st", name: "ELDEN RING", requires_membership: false }
    ];

    function loadGames() {
      const container = document.getElementById("gamesContainer");
      container.innerHTML = "";
      allGames.forEach(game => {
        const appId = game.st_file.split(".")[0];
        const card = document.createElement("div");
        card.className = "game-card";

        const denuvoTag = game.requires_membership
          ? `<span class="denuvo-tag">DENUVO</span>`
          : "";

        card.innerHTML = `
          <div class="game-media">
            <img src="${appId}.jpg" alt="${game.name}" onerror="this.src='placeholder.jpg'">
            <iframe src="https://store.steampowered.com/app/${appId}" loading="lazy"></iframe>
          </div>
          <div class="game-info">
            <div class="game-title">${game.name}</div>
            <div class="game-tags">
              <span class="game-id">AppID: ${appId}</span>
              ${denuvoTag}
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.addEventListener("DOMContentLoaded", loadGames);
  </script>
</body>
</html>
